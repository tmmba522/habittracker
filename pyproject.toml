[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "habittracker"
version = "1.0.0"
description = "A command-line habit tracker backed by SQLite."
requires-python = ">=3.8"
dependencies = []

[project.scripts]
habits = "habittracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
